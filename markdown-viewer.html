<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
    }

    /* ── Toolbar ────────────────────────────────────────────── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #24292f;
      border-bottom: 1px solid #30363d;
    }

    .toolbar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e6edf3;
      font-size: 14px;
      font-weight: 600;
    }

    #toolbar-filename {
      font-size: 12px;
      color: #8b949e;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      line-height: 20px;
      border: 1px solid;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-secondary {
      color: #e6edf3;
      background: #21262d;
      border-color: #30363d;
    }
    .btn-secondary:hover { background: #30363d; }

    .btn-green {
      color: #fff;
      background: #238636;
      border-color: rgba(240,246,252,.1);
    }
    .btn-green:hover { background: #2ea043; }

    /* ── Main layout ───────────────────────────────────────── */
    #app {
      max-width: 1012px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* ── Drop zone ─────────────────────────────────────────── */
    #drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 88px);
      text-align: center;
      padding: 48px 32px;
      border: 2px dashed #d0d7de;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    #drop-zone.drag-over {
      border-color: #0969da;
      background: #ddf4ff;
    }
    #drop-zone h2 {
      margin: 16px 0 8px;
      font-size: 20px;
      font-weight: 600;
    }
    #drop-zone p {
      margin: 0 0 20px;
      color: #57606a;
      font-size: 14px;
    }

    /* ── Content panel ─────────────────────────────────────── */
    #content-panel { display: none; }

    .file-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      color: #57606a;
    }
    .file-header span { font-weight: 600; color: #0969da; }

    /* github-markdown-css wrapper */
    .markdown-body {
      border: 1px solid #d0d7de;
      border-radius: 0 0 6px 6px;
      padding: 32px 40px;
      background: white;
    }

    /* Centre mermaid diagrams like GitHub does */
    .markdown-body .mermaid {
      text-align: center;
      margin: 20px 0;
      overflow-x: auto;
    }
    .markdown-body .mermaid svg { max-width: 100%; }

    /* Mermaid render error */
    .mermaid-error {
      padding: 12px 16px;
      background: #fff8c5;
      border: 1px solid #d4a72c;
      border-radius: 6px;
      font-size: 13px;
      color: #633c01;
      white-space: pre-wrap;
      font-family: monospace;
    }

    /* ── Loading overlay ───────────────────────────────────── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 14px;
      color: #57606a;
    }
    #loading.visible { display: flex; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #d0d7de;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Print / PDF ───────────────────────────────────────── */
    @media print {
      #toolbar, #drop-zone, .file-header { display: none !important; }
      body { background: white; }
      #app { padding: 0; max-width: 100%; }
      #content-panel { display: block !important; }
      .markdown-body {
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
      }
      .markdown-body .mermaid { page-break-inside: avoid; }
      .mermaid svg { max-width: 100% !important; }
    }
  </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────── -->
<div id="toolbar">
  <div class="toolbar-logo" style="margin-right:8px">
    <!-- Octicon: markdown -->
    <svg width="20" height="20" viewBox="0 0 16 16" fill="#e6edf3" aria-hidden="true">
      <path d="M14.85 3c.63 0 1.15.52 1.14 1.15v7.7c0 .63-.51 1.15-1.15 1.15H1.15C.52 13 0 12.48 0 11.84V4.15C0 3.52.52 3 1.15 3ZM9 11V5H7L5.5 7 4 5H2v6h2V8l1.5 2 1.5-2v3Zm2.99.5L14 8.5h-1.5V5h-2v3.5H9l2.99 3Z"/>
    </svg>
    Markdown Viewer
  </div>
  <span id="toolbar-filename"></span>

  <label class="btn btn-secondary" for="file-input" title="Open a Markdown file">
    <!-- Octicon: file -->
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 8.75 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/>
    </svg>
    Open File
  </label>

  <button id="export-btn" class="btn btn-green" style="display:none" onclick="exportPDF()">
    <!-- Octicon: download -->
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/>
      <path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.97a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/>
    </svg>
    Export PDF
  </button>
</div>

<!-- ── Loading overlay ──────────────────────────────────────── -->
<div id="loading">
  <div class="spinner"></div>
  <span>Rendering diagrams…</span>
</div>

<!-- ── App container ────────────────────────────────────────── -->
<div id="app">

  <!-- Drop zone (visible before any file is loaded) -->
  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <svg width="52" height="52" viewBox="0 0 16 16" fill="#8b949e" aria-hidden="true">
      <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 8.75 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/>
    </svg>
    <h2>Drop a Markdown file here</h2>
    <p>Supports GitHub Flavored Markdown with Mermaid diagrams</p>
    <button class="btn btn-green" onclick="event.stopPropagation(); document.getElementById('file-input').click()">
      Choose File
    </button>
  </div>

  <!-- Rendered content (hidden until file loaded) -->
  <div id="content-panel">
    <div class="file-header">
      <!-- Octicon: file -->
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#57606a" aria-hidden="true">
        <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 8.75 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/>
      </svg>
      <span id="content-filename"></span>
    </div>
    <article class="markdown-body" id="rendered-content"></article>
  </div>

</div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">

<!-- ── Scripts ───────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  // ── Mermaid setup ──────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose', // needed to render links inside diagrams
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
  });

  // ── marked setup: intercept ```mermaid blocks ──────────────
  marked.use({
    renderer: {
      code(token) {
        if (token.lang === 'mermaid') {
          // Wrap in a container; mermaid.run will replace the inner pre
          return `<div class="mermaid">${escapeHtml(token.text)}</div>\n`;
        }
        return false; // fall through to default renderer
      },
    },
    // Enable GFM (tables, strikethrough, task lists, etc.)
    gfm: true,
    breaks: false,
  });

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── File rendering ─────────────────────────────────────────
  async function renderFile(file) {
    const loading = document.getElementById('loading');
    loading.classList.add('visible');

    try {
      const text = await file.text();
      const html = marked.parse(text);

      const contentEl = document.getElementById('rendered-content');
      contentEl.innerHTML = html;

      // Reveal content panel, hide drop zone
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('content-panel').style.display = 'block';
      document.getElementById('export-btn').style.display = 'inline-flex';

      const name = file.name;
      document.getElementById('content-filename').textContent = name;
      document.getElementById('toolbar-filename').textContent = name;
      document.title = `${name} — Markdown Viewer`;

      // Render mermaid diagrams
      // mermaid.run expects elements whose textContent is the diagram source
      await mermaid.run({
        querySelector: '#rendered-content .mermaid',
        suppressErrors: false,
      }).catch(err => {
        console.warn('Mermaid run error:', err);
      });

    } finally {
      loading.classList.remove('visible');
    }
  }

  // ── File input ─────────────────────────────────────────────
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files[0]) {
      renderFile(e.target.files[0]);
      e.target.value = ''; // allow re-selecting the same file
    }
  });

  // ── Drag and drop ──────────────────────────────────────────
  const dropZone = document.getElementById('drop-zone');

  // Prevent browser from navigating to dropped file
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = [...(e.dataTransfer.files || [])].find(
      f => /\.(md|markdown|txt)$/i.test(f.name)
    );
    if (file) renderFile(file);
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });

  // Allow dropping onto content area too (re-open different file)
  document.getElementById('content-panel').addEventListener('dragover', e => e.preventDefault());
  document.getElementById('content-panel').addEventListener('drop', e => {
    e.preventDefault();
    const file = [...(e.dataTransfer.files || [])].find(
      f => /\.(md|markdown|txt)$/i.test(f.name)
    );
    if (file) renderFile(file);
  });

  // ── PDF export ─────────────────────────────────────────────
  window.exportPDF = function () {
    window.print();
  };
</script>

</body>
</html>
